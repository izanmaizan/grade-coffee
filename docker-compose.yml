# ============================================
# Green Bean Grading — orkestrasi lokal/staging (#37)
# ============================================
# Jalankan:  docker compose up --build
# Akses:     frontend http://localhost:8080  |  backend http://localhost:8000
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-green_bean_grading}
      MYSQL_USER: ${DB_USER:-green_bean_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootchangeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-green_bean_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-green_bean_grading}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_FORMAT: json
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - ./backend/weights:/app/weights:ro   # model YOLO (read-only)
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_UPLOADS_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads_data:
